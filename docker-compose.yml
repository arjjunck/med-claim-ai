# Run the whole app:  cp .env.example .env  (fill it in), then
#   docker compose up --build    (build locally)  or
#   docker compose pull && docker compose up    (use the published Docker Hub images)
# Frontend: http://localhost:8080 (it forwards /api to the API)   API directly: http://localhost:5050
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mediclaim_ai
      POSTGRES_USER: mediclaim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediclaim -d mediclaim_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: arjjunck/mediclaim-api:latest
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=mediclaim_ai;Username=mediclaim;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      OpenAI__ApiKey: ${NVIDIA_API_KEY:?Set NVIDIA_API_KEY in .env}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: MediClaimAI
      Jwt__Audience: MediClaimAIUsers
      Cors__AllowedOrigins__0: http://localhost:8080
    ports:
      - "5050:8080"

  web:
    image: arjjunck/mediclaim-web:latest
    build:
      context: ./frontend
    environment:
      API_UPSTREAM: http://api:8080
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
