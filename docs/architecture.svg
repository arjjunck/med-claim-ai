<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&amp;family=Inter:wght@400;500;600&amp;display=block');
      text { font-family: 'Inter', -apple-system, Helvetica, Arial, sans-serif; }
      .h { font-family: 'Montserrat', 'Inter', sans-serif; }
      .title { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 800; fill: #1C1814; }
      .sub { font-size: 17px; font-weight: 600; fill: #6B6158; }
      .body { font-size: 18px; fill: #3D3630; }
      .small { font-size: 16px; fill: #8C837A; }
      .chip { font-size: 16px; font-weight: 600; fill: #1C1814; }
      .label { font-size: 15px; font-weight: 700; fill: #6B6158; letter-spacing: 0.5px; }
      .section { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 900; fill: #1C1814; letter-spacing: 0.5px; }
      .line { stroke: #4A423A; stroke-width: 2.5; fill: none; }
      .card { fill: #FFFFFF; stroke: #1C1814; stroke-width: 2; }
      .soft { fill: #FFFFFF; stroke: #E4DACB; stroke-width: 1.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A423A"/>
    </marker>
    <radialGradient id="glow" cx="88%" cy="6%" r="45%">
      <stop offset="0%" stop-color="#FFE7D3"/>
      <stop offset="100%" stop-color="#FDF9EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: warm cream with a soft peach glow, like the reference -->
  <rect width="1600" height="1200" fill="#FDF9EE"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>

  <!-- Header -->
  <text x="60" y="90" class="h" font-size="46" font-weight="900" fill="#1C1814" letter-spacing="0.5">MEDICLAIM AI <tspan fill="#E0703A">·</tspan> SYSTEM ARCHITECTURE</text>
  <text x="60" y="130" font-size="21" fill="#5E554C">RAG document Q&amp;A with page-level citations, plus rule-based claim risk analysis</text>
  <text x="60" y="160" font-size="16" font-weight="500" fill="#A39B93" letter-spacing="2">Arjun Krishna Krishnakumar</text>

  <!-- User -->
  <rect x="60" y="330" width="230" height="170" rx="16" class="card"/>
  <text x="84" y="374" class="title">User</text>
  <text x="84" y="404" class="sub">Web browser</text>
  <text x="84" y="440" class="body">Upload PDFs &amp; CSVs</text>
  <text x="84" y="468" class="body">Ask questions</text>

  <!-- Azure region -->
  <rect x="330" y="186" width="870" height="594" rx="24" fill="#FFFFFF" fill-opacity="0.45" stroke="#A39B93" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="356" y="222" class="h" font-size="18" font-weight="800" fill="#1C1814" letter-spacing="1">MICROSOFT AZURE <tspan font-family="Inter" font-size="16" font-weight="500" fill="#8C837A" letter-spacing="0">· Switzerland North · Azure for Students</tspan></text>

  <!-- Container Apps environment -->
  <rect x="356" y="242" width="818" height="328" rx="18" fill="#F7F1E6" stroke="#E4DACB" stroke-width="1.5"/>
  <text x="380" y="273" class="h" font-size="14" font-weight="800" fill="#8C837A" letter-spacing="1.5">AZURE CONTAINER APPS</text>

  <!-- Web -->
  <rect x="380" y="292" width="300" height="254" rx="16" class="card"/>
  <text x="404" y="333" class="title">mediclaim-web</text>
  <text x="404" y="362" class="sub">nginx + React SPA</text>
  <text x="404" y="400" class="body">Serves the app (HTTPS)</text>
  <text x="404" y="428" class="body">Proxies /api to the API</text>
  <text x="404" y="456" class="body">React · TypeScript · Tailwind</text>
  <rect x="404" y="500" width="134" height="30" rx="15" fill="#F1E9DC"/>
  <text x="471" y="520" text-anchor="middle" font-size="14" font-weight="700" fill="#5E554C">public ingress</text>

  <!-- API -->
  <rect x="718" y="292" width="432" height="254" rx="16" class="card"/>
  <text x="742" y="333" class="title">mediclaim-api</text>
  <text x="742" y="362" class="sub">ASP.NET Core · .NET 10</text>
  <text x="742" y="398" class="body">JWT authentication</text>
  <text x="742" y="425" class="body">PDF → page-aware chunks (PdfPig)</text>
  <text x="742" y="452" class="body">Semantic search · cosine top-5</text>
  <text x="742" y="479" class="body">Rule-based claim risk engine</text>
  <rect x="742" y="500" width="250" height="30" rx="15" fill="#F1E9DC"/>
  <text x="867" y="520" text-anchor="middle" font-size="14" font-weight="700" fill="#5E554C">internal only · scales to zero</text>

  <!-- Secrets -->
  <rect x="380" y="600" width="300" height="156" rx="16" class="soft"/>
  <text x="404" y="640" class="title" style="font-size:22px">Secrets</text>
  <text x="404" y="667" class="sub">Container Apps secrets</text>
  <text x="404" y="702" class="body">NVIDIA key · JWT key</text>
  <text x="404" y="730" class="body">DB connection string</text>

  <!-- PostgreSQL -->
  <rect x="718" y="600" width="432" height="156" rx="16" class="card"/>
  <text x="742" y="640" class="title">PostgreSQL</text>
  <text x="742" y="667" class="sub">Azure Database for PostgreSQL · B1ms</text>
  <text x="742" y="702" class="body">Users · Documents · Claims · Chat history</text>
  <text x="742" y="730" class="body">Chunks with page numbers + embeddings</text>

  <!-- NVIDIA (the AI part gets the warm accent) -->
  <rect x="1250" y="292" width="300" height="254" rx="16" fill="#FFFFFF" stroke="#E0703A" stroke-width="2.5"/>
  <text x="1274" y="333" class="title">NVIDIA NIM API</text>
  <text x="1274" y="360" class="sub" style="fill:#C65A26">External AI service</text>
  <text x="1274" y="402" font-size="18" font-weight="700" fill="#1C1814">Embeddings</text>
  <text x="1274" y="428" class="body" style="font-size:16px">nemotron-3.5-embed-1b</text>
  <text x="1274" y="470" font-size="18" font-weight="700" fill="#1C1814">Answers (LLM)</text>
  <text x="1274" y="496" class="body" style="font-size:16px">nemotron-3.5-lightning-30b</text>

  <!-- Connections -->
  <line x1="290" y1="415" x2="376" y2="415" class="line" marker-end="url(#arrow)"/>
  <rect x="300" y="385" width="66" height="22" rx="11" fill="#FDF9EE"/>
  <text x="333" y="401" text-anchor="middle" class="label">HTTPS</text>

  <line x1="680" y1="419" x2="714" y2="419" class="line" marker-end="url(#arrow)"/>
  <text x="699" y="404" text-anchor="middle" class="label">/api</text>

  <line x1="1150" y1="419" x2="1246" y2="419" stroke="#E0703A" stroke-width="2.5" marker-start="url(#arrowAccent)" marker-end="url(#arrowAccent)"/>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#E0703A"/>
  </marker>
  <rect x="1160" y="385" width="80" height="22" rx="11" fill="#FDF9EE"/>
  <text x="1200" y="401" text-anchor="middle" class="label" style="fill:#C65A26">AI calls</text>

  <line x1="934" y1="546" x2="934" y2="596" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="948" y="578" class="label">EF Core</text>

  <path d="M680 640 H699 V512 H714" class="line" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <!-- RAG flow panel -->
  <rect x="60" y="820" width="860" height="330" rx="20" fill="#FFFFFF" stroke="#E4DACB" stroke-width="1.5"/>
  <text x="84" y="864" class="section">HOW RAG WORKS HERE</text>

  <text x="84" y="906" font-size="17" font-weight="700" fill="#1C1814"><tspan fill="#E0703A">01</tspan>  Upload a PDF</text>
  <g>
    <rect x="84" y="920" width="140" height="52" rx="12" fill="#F7F1E6" stroke="#E4DACB"/>
    <text x="154" y="951" text-anchor="middle" class="chip">PDF</text>
    <rect x="252" y="920" width="140" height="52" rx="12" fill="#F7F1E6" stroke="#E4DACB"/>
    <text x="322" y="951" text-anchor="middle" class="chip">Text per page</text>
    <rect x="420" y="920" width="140" height="52" rx="12" fill="#F7F1E6" stroke="#E4DACB"/>
    <text x="490" y="951" text-anchor="middle" class="chip">Chunks + pages</text>
    <rect x="588" y="920" width="140" height="52" rx="12" fill="#FFF1E6" stroke="#E0703A" stroke-opacity="0.6"/>
    <text x="658" y="951" text-anchor="middle" class="chip">Embeddings</text>
    <rect x="756" y="920" width="140" height="52" rx="12" fill="#F7F1E6" stroke="#E4DACB"/>
    <text x="826" y="951" text-anchor="middle" class="chip">PostgreSQL</text>
    <line x1="226" y1="946" x2="248" y2="946" class="line" marker-end="url(#arrow)"/>
    <line x1="394" y1="946" x2="416" y2="946" class="line" marker-end="url(#arrow)"/>
    <line x1="562" y1="946" x2="584" y2="946" class="line" marker-end="url(#arrow)"/>
    <line x1="730" y1="946" x2="752" y2="946" class="line" marker-end="url(#arrow)"/>
  </g>

  <text x="84" y="1026" font-size="17" font-weight="700" fill="#1C1814"><tspan fill="#E0703A">02</tspan>  Ask a question</text>
  <g>
    <rect x="84" y="1040" width="140" height="52" rx="12" fill="#F7F1E6" stroke="#E4DACB"/>
    <text x="154" y="1071" text-anchor="middle" class="chip">Question</text>
    <rect x="252" y="1040" width="140" height="52" rx="12" fill="#FFF1E6" stroke="#E0703A" stroke-opacity="0.6"/>
    <text x="322" y="1071" text-anchor="middle" class="chip">Embedding</text>
    <rect x="420" y="1040" width="140" height="52" rx="12" fill="#F7F1E6" stroke="#E4DACB"/>
    <text x="490" y="1071" text-anchor="middle" class="chip">Top-5 chunks</text>
    <rect x="588" y="1040" width="140" height="52" rx="12" fill="#FFF1E6" stroke="#E0703A" stroke-opacity="0.6"/>
    <text x="658" y="1071" text-anchor="middle" class="chip">LLM answer</text>
    <rect x="756" y="1040" width="140" height="52" rx="12" fill="#1C1814"/>
    <text x="826" y="1071" text-anchor="middle" class="chip" style="fill:#FDF9EE">Answer + pages</text>
    <line x1="226" y1="1066" x2="248" y2="1066" class="line" marker-end="url(#arrow)"/>
    <line x1="394" y1="1066" x2="416" y2="1066" class="line" marker-end="url(#arrow)"/>
    <line x1="562" y1="1066" x2="584" y2="1066" class="line" marker-end="url(#arrow)"/>
    <line x1="730" y1="1066" x2="752" y2="1066" class="line" marker-end="url(#arrow)"/>
  </g>
  <text x="84" y="1128" class="small">The LLM answers only from the retrieved chunks, so every answer cites its source pages.</text>

  <!-- Build & deploy panel -->
  <rect x="950" y="820" width="590" height="330" rx="20" fill="#FFFFFF" stroke="#E4DACB" stroke-width="1.5"/>
  <text x="974" y="864" class="section">BUILD &amp; DEPLOY</text>

  <rect x="974" y="880" width="542" height="44" rx="11" fill="#F7F1E6" stroke="#E4DACB"/>
  <text x="994" y="908" class="chip" style="font-size:17px">GitHub <tspan style="fill:#6B6158;font-weight:400">· source code + pull requests</tspan></text>
  <line x1="1245" y1="926" x2="1245" y2="938" class="line" marker-end="url(#arrow)"/>
  <rect x="974" y="942" width="542" height="44" rx="11" fill="#F7F1E6" stroke="#E4DACB"/>
  <text x="994" y="970" class="chip" style="font-size:17px">docker buildx <tspan style="fill:#6B6158;font-weight:400">· multi-arch (amd64 + arm64)</tspan></text>
  <line x1="1245" y1="988" x2="1245" y2="1000" class="line" marker-end="url(#arrow)"/>
  <rect x="974" y="1004" width="542" height="44" rx="11" fill="#F7F1E6" stroke="#E4DACB"/>
  <text x="994" y="1032" class="chip" style="font-size:17px">Docker Hub <tspan style="fill:#6B6158;font-weight:400">· arjjunck/mediclaim-api, -web</tspan></text>
  <line x1="1245" y1="1050" x2="1245" y2="1062" class="line" marker-end="url(#arrow)"/>
  <rect x="974" y="1066" width="542" height="44" rx="11" fill="#1C1814"/>
  <text x="994" y="1094" class="chip" style="fill:#FDF9EE;font-size:17px">Azure Container Apps <tspan style="fill:#CFC6BB" font-weight="400">· pulls new versions</tspan></text>
  <text x="974" y="1136" class="small">Local: docker compose up runs Postgres + API + web</text>

  <!-- Footer -->
  <text x="1540" y="1184" text-anchor="end" class="small" letter-spacing="0.5">github.com/arjjunck/med-claim-ai</text>
</svg>
